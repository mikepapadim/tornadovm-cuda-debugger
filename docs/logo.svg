<svg xmlns="http://www.w3.org/2000/svg" width="360" height="96" viewBox="0 0 360 96" role="img" aria-label="tcd logo">
  <title>tcd: TornadoVM CUDA debugger</title>
  <!-- mark: a 4x4 block of GPU threads, one of them stopped at a breakpoint -->
  <rect x="4" y="4" width="88" height="88" rx="18" fill="#0f1216" stroke="#2f3742" stroke-width="2"/>
  <g fill="#76b900">
    <rect x="18" y="18" width="12" height="12" rx="3"/><rect x="36" y="18" width="12" height="12" rx="3"/><rect x="54" y="18" width="12" height="12" rx="3"/><rect x="72" y="18" width="6" height="12" rx="3" opacity=".35"/>
    <rect x="18" y="36" width="12" height="12" rx="3"/><rect x="36" y="36" width="12" height="12" rx="3"/><rect x="72" y="36" width="6" height="12" rx="3" opacity=".35"/>
    <rect x="18" y="54" width="12" height="12" rx="3"/><rect x="36" y="54" width="12" height="12" rx="3"/><rect x="54" y="54" width="12" height="12" rx="3"/><rect x="72" y="54" width="6" height="12" rx="3" opacity=".35"/>
    <rect x="18" y="72" width="12" height="6" rx="3" opacity=".35"/><rect x="36" y="72" width="12" height="6" rx="3" opacity=".35"/><rect x="54" y="72" width="12" height="6" rx="3" opacity=".35"/>
  </g>
  <!-- the stopped thread -->
  <circle cx="60" cy="42" r="8" fill="#e5484d"/>
  <circle cx="60" cy="42" r="12" fill="none" stroke="#e5484d" stroke-width="2" opacity=".45"/>
  <!-- wordmark -->
  <text x="112" y="58" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="44" font-weight="700" fill="#76b900">tcd</text>
  <text x="114" y="80" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#8a93a1">TornadoVM CUDA debugger</text>
</svg>
